<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <link href="styles.css" rel="stylesheet">
    <title>My Webpage</title>
    <script>
        function changeBackgroundColor() {
            document.body.style.backgroundColor = document.body.style.backgroundColor === 'white' ? '#e0f7e9' : 'white';
        }

        function toggleTextField() {
            const textField = document.getElementById('feedbackTextField');
            textField.classList.toggle('d-none');
        }

        function sendFeedback() {
            const textField = document.getElementById('feedbackTextField');
            const textarea = document.getElementById('feedbackTextarea');
            textarea.value = '';
            textField.classList.add('d-none');
        }
    </script>

</head>
<body>
    <div class="container">
        <h1 class="mb-4">Welcome to My Animal World</h1>
        <div class="card card-custom mx-auto">
            <img src="https://theaumnibus.com/wp-content/uploads/2019/09/Steve-Irwin-1.jpg" class="card-img-top img-fixed-size" alt="Steve Irwin">
            <div class="card-body">
                <p class="hello-mate">Hello mate!</p>
                <p class="card-text">Didn't see ya there! Are you excited to learn more about some amazing animals by exploring the pages below!?</p>
            </div>
        </div>
        <div class="mt-4">
            <a href="koala.html" class="btn btn-success btn-lg mx-2">Koala</a>
            <a href="alligator.html" class="btn btn-success btn-lg mx-2">Alligator</a>
            <a href="penguin.html" class="btn btn-success btn-lg mx-2">Penguin</a>
        </div>
    </div>

    <footer class="text-center mt-5">
        <p>Let us know what you think!</p>

        <button class="btn btn-secondary mb-3" onclick="toggleTextField()">Contribute</button>

        <div id="feedbackTextField" class="d-none">
            <textarea id="feedbackTextarea" class="form-control" rows="3" placeholder="For example, if you want us to add another animal!"></textarea>
            <button class="btn btn-primary" onclick="sendFeedback()">Send</button>
        </div>
    </footer>

</body>
</html>
