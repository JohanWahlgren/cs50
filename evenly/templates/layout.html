<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- External CSS -->
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">

    <title>Evenly.io - {% block title %}{% endblock %}</title>
</head>
<body>

    <!-- Header with Borders -->
    <header class="site-header">
        <a href="/home" class="text-decoration-none">Evenly.io</a>
        <a href="/profile" class="text-decoration-none">Profile</a>
    </header>

    <!-- Main Content Block -->
    <main class="main-content">

        <!-- Flash Messages -->
        <div class="container mt-3">
            {% with messages = get_flashed_messages(with_categories=True) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="custom-flash alert alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
        
        <div class="scroll-wrapper">
            {% block main %}{% endblock %}
        </div>
    </main>

    <!-- Footer with Borders -->
    <footer class="site-footer">
        <a href="/help" class="text-decoration-none">Help</a>
    </footer>

    <!-- Error Modal -->
    <div class="modal fade auth-modal" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">Error</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="errorMessage">{{ session.get("error") }}</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- External JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
